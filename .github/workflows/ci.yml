name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch SVG test suite
        run: |
          chmod +x ../scripts/fetch-test-suite.sh
          ../scripts/fetch-test-suite.sh
      - name: Verify smoke goldens
        run: |
          chmod +x ../scripts/generate-suite-goldens.sh
          ../scripts/generate-suite-goldens.sh smoke
          git diff --exit-code -- resvg-mobile/tests/suite/goldens/smoke.jsonl || {
            echo "::error::smoke.jsonl drift — regenerate and commit goldens"
            exit 1
          }
      - name: Test
        run: |
          cargo test -p resvg-mobile
          cargo test -p resvg-mobile --no-default-features
          cargo test -p resvg-mobile --no-default-features --features text
          cargo test -p resvg-mobile --no-default-features --features images
      - name: Release build (size check)
        run: |
          for args in "" "--no-default-features --features text" "--no-default-features --features images" "--no-default-features"; do
            echo "==> cargo build --release $args"
            # shellcheck disable=SC2086
            cargo build -p resvg-mobile --release $args
          done
          ls -lh target/release/libuniffi_resvg_mobile.* || ls -lh target/release/*.rlib
      - name: Generate bindings and check drift
        run: |
          cargo run -p resvg-mobile --features bindgen-cli --bin uniffi-bindgen -- generate \
            resvg-mobile/src/resvg_mobile.udl --language kotlin \
            --config resvg-mobile/uniffi.toml \
            --out-dir /tmp/kt --no-format
          cargo run -p resvg-mobile --features bindgen-cli --bin uniffi-bindgen -- generate \
            resvg-mobile/src/resvg_mobile.udl --language swift \
            --config resvg-mobile/uniffi.toml \
            --out-dir /tmp/swift
          # Compare against committed bindings (ignore generator banner wording).
          diff -u ../android/resvg-mobile/src/main/java/com/resvg/mobile/resvg_mobile.kt \
            /tmp/kt/com/resvg/mobile/resvg_mobile.kt || {
              echo "::error::Kotlin UniFFI bindings are out of date; regenerate and commit."
              exit 1
            }
          diff -u ../ios/Sources/ResvgMobile/Generated/resvg_mobile.swift \
            /tmp/swift/resvg_mobile.swift || {
              echo "::error::Swift UniFFI bindings are out of date; regenerate and commit."
              exit 1
            }

  android:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build native libs (all size variants)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/build-android-variants.sh
          ./scripts/build-android-variants.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble AAR + demo
        working-directory: android
        env:
          SKIP_CARGO_NDK: "1"
        run: |
          chmod +x gradlew
          ./gradlew \
            :resvg-mobile:assembleFullRelease \
            :resvg-mobile:assembleNoImagesRelease \
            :resvg-mobile:assembleNoTextRelease \
            :resvg-mobile:assembleMinimalRelease \
            :resvg-mobile-ui:assembleRelease \
            :resvg-mobile-coil:assembleRelease \
            :demo:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-aars
          path: |
            android/resvg-mobile/build/outputs/aar/*.aar
            android/resvg-mobile-ui/build/outputs/aar/*.aar
            android/resvg-mobile-coil/build/outputs/aar/*.aar
            NOTICE
            LICENSE

  ios:
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build XCFramework (all variants)
        run: VARIANT=all ./rust/build-ios.sh
      - name: Compile Swift package
        working-directory: ios
        run: |
          xcodebuild -scheme ResvgMobile \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/ResvgMobile-Package \
            CODE_SIGNING_ALLOWED=NO build
      - name: Compile iOS demo
        working-directory: examples/ios-demo
        run: |
          xcodebuild -project ResvgDemo.xcodeproj -scheme ResvgDemo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/ResvgDemo-DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package XCFramework zips
        run: |
          cd ios
          ditto -c -k --keepParent ResvgMobileFFI.xcframework ResvgMobileFFI.xcframework.zip
          for v in full no-images no-text minimal; do
            ditto -c -k --keepParent "variants/$v/ResvgMobileFFI.xcframework" \
              "ResvgMobileFFI-$v.xcframework.zip"
          done
          cp ../NOTICE ../LICENSE .
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: |
            ios/ResvgMobileFFI.xcframework.zip
            ios/ResvgMobileFFI-*.xcframework.zip
            ios/NOTICE
            ios/LICENSE

  suite-android:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build full variant for emulator (x86_64)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VARIANT: full
        run: |
          chmod +x scripts/build-android-variants.sh scripts/fetch-test-suite.sh scripts/sync-suite-assets.sh
          ./scripts/fetch-test-suite.sh
          ./scripts/build-android-variants.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sync smoke assets
        run: ./scripts/sync-suite-assets.sh smoke
      - name: Android smoke suite (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            chmod +x scripts/run-android-suite.sh android/gradlew
            # Assets already synced; skip re-fetch inside script by keeping vendor
            MANIFEST=smoke SUITE_OUT_DIR=$GITHUB_WORKSPACE/artifacts/suite \
              ./scripts/run-android-suite.sh
        env:
          SKIP_CARGO_NDK: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-android-smoke
          path: artifacts/suite/android-results.jsonl

  suite-ios:
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Fetch suite + build XCFramework
        run: |
          chmod +x scripts/fetch-test-suite.sh scripts/sync-suite-assets.sh scripts/run-ios-suite.sh rust/build-ios.sh
          ./scripts/fetch-test-suite.sh
          VARIANT=full ./rust/build-ios.sh
      - name: iOS smoke suite (simulator)
        run: |
          mkdir -p artifacts/suite
          MANIFEST=smoke SUITE_OUT_DIR=$GITHUB_WORKSPACE/artifacts/suite \
            ./scripts/run-ios-suite.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-ios-smoke
          path: artifacts/suite/ios-results.jsonl

  suite-compare:
    runs-on: ubuntu-latest
    needs: [suite-android, suite-ios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: suite-android-smoke
          path: artifacts/suite
      - uses: actions/download-artifact@v4
        with:
          name: suite-ios-smoke
          path: artifacts/suite
      - name: Compare smoke results
        run: |
          chmod +x scripts/compare-suite-results.py
          python3 scripts/compare-suite-results.py \
            --golden rust/resvg-mobile/tests/suite/goldens/smoke.jsonl \
            --android artifacts/suite/android-results.jsonl \
            --ios artifacts/suite/ios-results.jsonl \
            --fuzzy on-mismatch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: suite-smoke-diffs
          path: artifacts/suite/
