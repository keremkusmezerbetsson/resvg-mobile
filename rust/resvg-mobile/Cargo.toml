[package]
name = "resvg-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cross-platform SVG rasterizer for Android and iOS (resvg + UniFFI)"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "uniffi_resvg_mobile"

[dependencies]
# Keep text + svgz; drop system-fonts (we load dirs/bytes ourselves).
# raster-images keeps JPEG/GIF/WebP for embedded <image>.
resvg = { version = "0.48.1", default-features = false, features = ["text", "svgz", "memmap-fonts", "raster-images"] }
usvg = { version = "0.48.1", default-features = false, features = ["text", "svgz", "memmap-fonts"] }
tiny-skia = "0.12"
# Do not enable uniffi/cli on the library — it pulls bindgen into Android .so builds.
uniffi = { version = "0.29.4", default-features = false }
thiserror = "2"

[build-dependencies]
uniffi = { version = "0.29.4", default-features = false, features = ["build"] }

[dev-dependencies]
sha2 = "0.10"

[features]
default = []
# Host-only: `cargo run -p resvg-mobile --features bindgen-cli --bin uniffi-bindgen -- …`
bindgen-cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]
