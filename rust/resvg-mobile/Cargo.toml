[package]
name = "resvg-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cross-platform SVG rasterizer for Android and iOS (resvg + UniFFI)"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "uniffi_resvg_mobile"

[dependencies]
# Base always includes svgz. Optional text/images shrink mobile binaries.
resvg = { version = "0.48.1", default-features = false, features = ["svgz"] }
usvg = { version = "0.48.1", default-features = false, features = ["svgz"] }
tiny-skia = "0.12"
# Do not enable uniffi/cli on the library — it pulls bindgen into Android .so builds.
uniffi = { version = "0.29.4", default-features = false }
thiserror = "2"
sha2 = "0.10"

[build-dependencies]
uniffi = { version = "0.29.4", default-features = false, features = ["build"] }

[dev-dependencies]

[features]
default = ["text", "images"]
# Font/text stack (TTF/OTF via fontdb + harfrust/skrifa).
text = ["resvg/text", "usvg/text", "resvg/memmap-fonts", "usvg/memmap-fonts"]
# Embedded raster images: JPEG/GIF/WebP (resvg raster-images).
images = ["resvg/raster-images"]
# Host-only: `cargo run -p resvg-mobile --features bindgen-cli --bin uniffi-bindgen -- …`
bindgen-cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[[bin]]
name = "suite-goldens"
path = "src/bin/suite-goldens.rs"
